<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PhoneDrop">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>PhoneDrop</title>
</head>
<body>
  <main class="app" id="app" hidden>
    <header class="top">
      <div class="pill"><span class="dot" id="dot"></span><span id="hostLabel">Connecting</span></div>
      <button class="link" id="forget" type="button">PIN</button>
    </header>


    <section class="stack" aria-label="Send to Mac">
      <figure class="item">
        <button class="orb" id="micOrb" type="button" aria-label="Speak, tap to start and stop">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-fg" cx="50" cy="50" r="47"/></svg>
          <span class="pulse" aria-hidden="true"></span>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.8" width="6" height="12" rx="3"/><path d="M5.2 11.2a6.8 6.8 0 0 0 13.6 0M12 18.2v3"/></svg>
        </button>
        <figcaption id="micLabel">Speak</figcaption>
      </figure>

      <figure class="item">
        <label class="orb" id="videoOrb" aria-label="Record video">
          <input id="videoInput" type="file" accept="video/*" capture>
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-fg" cx="50" cy="50" r="47"/></svg>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="6" width="13.2" height="12" rx="2.8"/><path d="m16 10.6 5.2-3v8.8l-5.2-3"/></svg>
        </label>
        <figcaption>Video</figcaption>
      </figure>

      <figure class="item">
        <label class="orb" id="fileOrb" aria-label="Send files">
          <input id="fileInput" type="file" multiple>
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-fg" cx="50" cy="50" r="47"/></svg>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 11.6 12 20.2a5.6 5.6 0 0 1-7.9-7.9l9-9a3.8 3.8 0 0 1 5.4 5.4l-9 9a2 2 0 0 1-2.8-2.8l8.1-8.1"/></svg>
        </label>
        <figcaption>Files</figcaption>
      </figure>
    </section>

    <footer class="bottom">
      <button class="enter" id="enterBtn" type="button" aria-label="Press Enter on Mac">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5m0 0 4-4m-4 4 4 4"/></svg>
        Return
      </button>
    </footer>
  </main>

  <main class="gate" id="gate" hidden>
    <form id="pinForm" autocomplete="off">
      <img class="gate-icon" src="icon-180.png" alt="" width="84" height="84">
      <h1>PhoneDrop</h1>
      <p>Type the PIN shown in the terminal on your Mac. You only do this once.</p>
      <input id="pinInput" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="12" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit">Connect</button>
      <p class="error" id="pinError" role="alert"></p>
    </form>
  </main>

  <!-- Dictation box: grows out of the Dynamic Island, or drops from the top edge on other iPhones -->
  <div class="sheet" id="sheet" data-kind="drop" role="status" aria-live="polite" aria-hidden="true">
    <div class="sheet-inner" id="sheetInner">
      <div class="sheet-head">
        <span class="bars" id="sheetBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="sheet-title" id="sheetTitle">Listening</span>
      </div>
      <p class="sheet-text" id="sheetText"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
